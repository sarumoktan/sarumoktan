<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sawruu | GitHub Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background: #0d1117;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .profile {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      text-align: center;
    }

    h1 {
      font-size: 44px;
      margin: 20px 0 40px;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 35px;
    }

    .stats img {
      height: 150px;
      max-width: 100%;
      object-fit: contain;
    }

    /* =========================
       SOCIAL BUTTONS
    ========================= */

    .socials {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 30px 0;
    }

    .socials a {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .socials a:hover {
      transform: translateY(-3px);
    }

    .socials img {
      height: 28px;
    }

    /* =========================
       TECHNOLOGIES
    ========================= */

    .techs {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 25px;
      margin: 35px 0;
    }

    .techs img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    /* =========================
       GIF
    ========================= */

    .coding {
      display: flex;
      justify-content: flex-end;
      margin-top: 35px;
      margin-bottom: 40px;
    }

    .coding img {
      width: 190px;
      height: 190px;
      object-fit: cover;
      border-radius: 10px;
    }

    /* =========================
       SNAKE PREVIEW
    ========================= */

    .snake-section {
      margin-top: 50px;
      padding-bottom: 50px;
    }

    .snake-section h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .snake-preview {
      width: 100%;
      min-height: 120px;
      border: 1px solid #30363d;
      border-radius: 10px;
      background: #161b22;
      padding: 25px;
      overflow: hidden;
    }

    .snake-line {
      position: relative;
      height: 50px;
      width: 100%;
    }

    .snake {
      position: absolute;
      left: 0;
      top: 10px;
      font-size: 30px;
      animation: moveSnake 5s linear infinite;
    }

    @keyframes moveSnake {
      0% {
        left: 0%;
      }

      50% {
        left: 85%;
      }

      100% {
        left: 0%;
      }
    }

    .notice {
      margin-top: 15px;
      color: #8b949e;
      font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      body {
        padding: 25px 10px;
      }

      h1 {
        font-size: 36px;
      }

      .stats img {
        width: 100%;
        height: auto;
      }

      .coding {
        justify-content: center;
      }

      .coding img {
        width: 150px;
        height: 150px;
      }

    }
  </style>
</head>
